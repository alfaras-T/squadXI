name: iOS build

# push / PR: 署名なしでビルドが通るかだけ確認する（Secrets 不要）
# 手動実行で upload=true: 署名してアーカイブし、TestFlight へアップロードする
on:
  push:
    paths:
      - "squadxi-ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "squadxi-ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "TestFlight にアップロードする"
        type: boolean
        default: false
      build_number:
        description: "ビルド番号（空なら実行番号を使う。前回より大きい数にすること）"
        type: string
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: squadxi-ios
    env:
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
      ICON_URL: https://squadxi.futbol/icon-1024.png
      APPICON: ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
    steps:
      - uses: actions/checkout@v4

      # App Store Connect へのアップロードは最新の Xcode（iOS SDK）でビルドする必要がある
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: squadxi-ios/package-lock.json

      - run: xcodebuild -version && node -v && pod --version

      - run: npm ci

      - name: アプリアイコンを配置（resources/icon-1024.png を優先、無ければサイトから取得）
        run: |
          if [ -f resources/icon-1024.png ]; then
            src=resources/icon-1024.png
          else
            curl -fsSL "$ICON_URL" -o "$RUNNER_TEMP/icon-1024.png"
            src="$RUNNER_TEMP/icon-1024.png"
            echo "::warning::resources/icon-1024.png が無いため $ICON_URL を使いました"
          fi
          w=$(sips -g pixelWidth "$src" | awk '/pixelWidth/{print $2}')
          h=$(sips -g pixelHeight "$src" | awk '/pixelHeight/{print $2}')
          alpha=$(sips -g hasAlpha "$src" | awk '/hasAlpha/{print $2}')
          echo "icon: ${w}x${h} hasAlpha=${alpha}"
          if [ "$w" != 1024 ] || [ "$h" != 1024 ] || [ "$alpha" = yes ]; then
            echo "::error::アイコンは 1024x1024・透過なしの PNG が必要です"
            exit 1
          fi
          cp "$src" "$APPICON"

      # www のコピーと pod install（Capacitor が macOS 上でのみ実行する）
      - run: npx cap sync ios

      - name: ビルド確認（署名なし）
        if: env.UPLOAD != 'true'
        run: |
          xcodebuild -quiet \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: App Store Connect API キーを用意
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ]    || missing="$missing APP_STORE_CONNECT_API_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_API_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing APP_STORE_CONNECT_API_KEY_P8"
          [ -n "$TEAM_ID" ]       || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::リポジトリの Secrets が未設定です:$missing"
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: アーカイブ（署名あり）
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          echo "build number: $BUILD_NUMBER"
          xcodebuild -quiet \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: TestFlight へアップロード
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: API キーを削除
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
